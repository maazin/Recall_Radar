# Render blueprint — the free-tier deployment.
#
# Two services, no database. Postgres lives on Neon rather than Render because
# Render deletes free Postgres instances after 30 days, which would take the
# feed down every month. Neon's free tier is persistent and the whole dataset
# is ~11 MB against a 0.5 GB allowance.
#
# The daily ingest is not defined here either: Render cron jobs are a paid
# feature, and .github/workflows/ingest.yml already does the job on GitHub's
# runners, free for public repositories.
#
# What this costs: nothing. What that buys you is one real limitation — the
# free web service sleeps after 15 minutes idle, so the first request after a
# quiet spell waits roughly 50 seconds for a cold start. The static site is
# unaffected, so the page paints immediately and the advisories arrive late.
# Upgrading the api service to Starter removes it.

services:
  - type: web
    name: recallradar-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on boot rather than in a pre-deploy hook, which Render
    # only offers on paid plans. `alembic upgrade head` is idempotent, so
    # repeating it on every restart is harmless.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Neon connection string. Set in the Render dashboard, not here.
      # Must use the psycopg driver: postgresql+psycopg://USER:PASS@HOST/DB?sslmode=require
      - key: DATABASE_URL
        sync: false
      # The static site's URL, so the browser is allowed to call this API.
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: recallradar-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_BASE_URL
        fromService:
          type: web
          name: recallradar-web
          envVarKey: RENDER_EXTERNAL_URL
      # Optional. openFDA works unauthenticated at this volume; add a key only
      # if you start hitting rate limits.
      - key: OPENFDA_API_KEY
        sync: false
      # Brevo SMTP, or any provider. Left unset the app logs what it would have
      # sent instead of sending — see DEPLOY.md before enabling the form.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false

  - type: web
    name: recallradar-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the bundle at build time, so changing it needs a rebuild.
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: recallradar-api
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
