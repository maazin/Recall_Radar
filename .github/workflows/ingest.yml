name: Scheduled ingestion

# openFDA refreshes weekly and CDC every Wednesday, so a daily run is ample and
# stays well inside the unauthenticated rate limits. The job is also dispatchable
# by hand for a backfill after a source mapper is fixed.
on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily
  workflow_dispatch:
    inputs:
      source:
        description: Which source to ingest
        required: false
        default: all
        type: choice
        options: [all, fda-recalls, fsis-recalls, cdc-outbreaks, fda-outbreaks]

jobs:
  ingest:
    name: Ingest agency sources
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      # Point at the deployed database. Set these in the repository's
      # Settings -> Secrets and variables -> Actions.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Ingest
        # Exits non-zero if any source failed a structure check, which surfaces
        # a drifted upstream page as a failed workflow run rather than silence.
        run: python -m app.ingest.run --source "${{ inputs.source || 'all' }}"
