[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    # Shadowing the `type` builtin is deliberate: `type` is a query parameter
    # name in the public API and a column name in the data model.
    "A002",
    "B008",  # FastAPI's Depends()/Query() defaults are the documented idiom.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:bs4.*",
]
