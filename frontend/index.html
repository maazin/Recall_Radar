    <title>RecallRadar: Food recalls and outbreak investigations</title>
    <meta
      name="description"
      content="RecallRadar indexes food recalls and foodborne-illness outbreak investigations published by the FDA, USDA/FSIS and CDC, and links to the original agency record for every entry."

      Public Sans is the typeface of the U.S. Web Design System, so it is what

      republishes federal records. Newsreader carries the headings, giving the
      page the register of a published bulletin rather than a dashboard template.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
