services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recallradar
      POSTGRES_PASSWORD: recallradar
      POSTGRES_DB: recallradar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the database the test suite uses, alongside the dev one.
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recallradar -d recallradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://recallradar:recallradar@db:5432/recallradar
      CORS_ORIGINS: http://localhost:5173
      APP_BASE_URL: http://localhost:5173
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Scheduled ingestion for local and self-hosted running. On GitHub-hosted
  # deployments the .github/workflows/ingest.yml cron does the same job.
  ingest:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://recallradar:recallradar@db:5432/recallradar
      APP_BASE_URL: http://localhost:5173
      LOG_LEVEL: INFO
      # Leave SMTP_HOST unset to log notifications instead of sending them.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
    # Ingest on start, then once a day. A source that fails its structure check
    # logs loudly and is retried on the next tick rather than killing the loop.
    command: >
      sh -c "alembic upgrade head &&
             while true; do
               python -m app.ingest.run --source all || echo '[ingest] finished with failures';
               sleep 86400;
             done"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
