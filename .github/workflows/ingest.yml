name: Scheduled ingestion

# openFDA refreshes weekly and CDC every Wednesday, so a daily run is ample and
# stays well inside the unauthenticated rate limits. The job is also dispatchable
# by hand for a backfill after a source mapper is fixed.
on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily
  workflow_dispatch:
    inputs:
      source:
        description: Which source to ingest
        required: false
        default: all
        type: choice
        options: [all, fda-recalls, fsis-recalls, cdc-outbreaks, fda-outbreaks]
      defer_notifications:
        description: Queue notifications without sending mail (diagnostic run)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Cron, retries and manual refreshes must not race to enqueue the same records.
concurrency:
  group: recallradar-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest agency sources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      # Point at the deployed database. Set these in the repository's
      # Settings -> Secrets and variables -> Actions.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INGEST_SOURCE: ${{ inputs.source || 'all' }}
      DEFER_NOTIFICATIONS: ${{ inputs.defer_notifications && 'true' || 'false' }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Ingest
        # Exit codes carry different meanings, so they get handled differently:
        #
        #   0  something was ingested and nothing had drifted
        #   1  a source's structure changed. Deterministic, so retrying just
        #      gets the same answer. Fail immediately and let a human look.
        #   2  nothing could be reached this run. Only openFDA is reachable from
        #      a cloud runner, so any hiccup there means no source succeeds.
        #      That was turning ordinary upstream flakiness into a failed job
        #      roughly once a week, for a run that loses nothing: each run
        #      re-reads a rolling window, so the next one backfills whatever was
        #      missed. Worth retrying before calling it a failure.
        run: |
          args=(--source "$INGEST_SOURCE")
          if [ "$DEFER_NOTIFICATIONS" = true ]; then
            args+=(--defer-notifications)
          fi
          for attempt in 1 2 3; do
            python -m app.ingest.run "${args[@]}" && exit 0
            code=$?
            if [ "$code" -ne 2 ]; then
              exit "$code"
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Attempt $attempt reached no source. Retrying in 90s."
              sleep 90
            fi
          done
          echo "::error::No source could be reached across 3 attempts over ~3 minutes."
          exit 1
